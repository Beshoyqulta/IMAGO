services:
  - type: web
    name: imago-youth
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: SERVANT_PASSCODES
        sync: false
      - key: CORS_ORIGINS
        value: https://imago-youth.onrender.com
