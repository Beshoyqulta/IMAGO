<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imago Youth</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui;background:#0f172a;color:#f8fafc}.gradient{background:linear-gradient(135deg,#4f46e5,#7c3aed 45%,#db2777)}.card{background:#1e293bd9;border:1px solid #94a3b829;backdrop-filter:blur(12px)}.hidden{display:none!important}</style></head>
<body><div id="toast" class="fixed top-4 right-4 z-50"></div>
<section id="landing" class="min-h-screen gradient flex items-center justify-center p-4"><div class="w-full max-w-md card rounded-3xl p-6 shadow-2xl"><div class="text-center mb-6"><div class="text-5xl">🔥</div><h1 class="text-4xl font-black mt-3">Imago Youth</h1><p class="text-indigo-100 text-sm mt-2">Madinaty Evangelical Church · Sanawy Meeting</p></div><div class="flex gap-1 bg-slate-950/50 p-1 rounded-xl mb-4"><button id="loginMode" class="mode w-1/2 rounded-lg py-2 bg-white text-indigo-950 font-bold">Login</button><button id="signupMode" class="mode w-1/2 rounded-lg py-2 text-slate-300 font-bold">Sign up</button></div><div class="flex gap-2 mb-5"><button data-role="youth" class="role w-1/2 rounded-xl py-2.5 bg-fuchsia-600 font-bold">📱 Youth</button><button data-role="servant" class="role w-1/2 rounded-xl py-2.5 bg-slate-800 text-slate-300 font-bold">🛡️ Servant</button></div><h2 id="authTitle" class="text-xl font-bold">Welcome back</h2><p id="authHint" class="text-xs text-slate-400 mt-1">Log in to view your points and notifications.</p><form id="authForm" class="space-y-3 mt-5"><input id="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_]+" placeholder="Username" class="field"><input id="password" required minlength="8" type="password" placeholder="Password (8+ characters)" class="field"><div id="signupFields" class="hidden space-y-3"><input id="name" placeholder="Full name" class="field"><div class="flex gap-2"><select id="gender" class="field w-1/2"><option value="boy">Boy</option><option value="girl">Girl</option></select><select id="grade" class="field w-1/2"><option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option></select></div></div><button id="submit" class="w-full gradient rounded-xl py-3 font-bold">Log in</button></form><p id="message" class="text-xs text-center text-amber-200 mt-4"></p></div></section>
<section id="app" class="hidden min-h-screen"><header class="gradient sticky top-0 z-20"><div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center"><div><h1 class="text-xl font-black">🔥 IMAGO YOUTH</h1><p class="text-xs text-indigo-100">Sanawy Meeting · Fridays 7:00 PM</p></div><div class="flex items-center gap-2"><span id="account" class="text-xs bg-white/10 p-2 rounded-lg"></span><button id="logout" class="bg-rose-500/80 rounded-lg px-3 py-2 text-xs font-bold">Log out</button></div></div></header><main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-5"><div id="hero" class="card rounded-2xl p-5"></div><nav class="flex gap-2 border-b border-slate-800"><button data-tab="board" class="tab p-3 border-b-2 border-amber-400 text-amber-300 font-bold text-sm">🏆 Rankings</button><button data-tab="notes" class="tab p-3 border-b-2 border-transparent text-slate-300 font-bold text-sm">📲 Notifications <span id="unread" class="bg-slate-700 rounded px-1">0</span></button><button id="servantTab" data-tab="studio" class="tab hidden p-3 border-b-2 border-transparent text-slate-300 font-bold text-sm">⚡ Servant Studio</button></nav><section id="board" class="space-y-4"><div class="card rounded-xl p-4 flex flex-wrap gap-2"><button data-gender="all" class="gender bg-indigo-600 rounded-lg px-3 py-2 text-xs font-bold">All Youth</button><button data-gender="boy" class="gender bg-slate-800 rounded-lg px-3 py-2 text-xs">👦 Boys</button><button data-gender="girl" class="gender bg-slate-800 rounded-lg px-3 py-2 text-xs">👧 Girls</button><select id="sort" class="bg-slate-800 rounded-lg px-3 py-2 text-xs"><option value="total">Total points</option><option value="early">Early arrival</option><option value="bible_read">Bible reading</option><option value="verse_recite">Verse recitation</option><option value="involvement">Involvement</option><option value="misc">Miscellaneous</option></select><input id="search" placeholder="Search name or grade" class="field sm:ml-auto"></div><div class="card rounded-xl overflow-hidden"><div class="p-4 border-b border-slate-800 flex justify-between"><b>Sanawy Youth Standings</b><span id="count" class="text-xs text-indigo-300"></span></div><div id="leaderboard"></div></div></section><section id="notes" class="hidden space-y-3"><div class="card rounded-xl p-5"><h2 class="font-bold">📲 My Notifications</h2><p class="text-xs text-slate-400">Points awarded to your profile.</p></div><div id="notifications" class="space-y-3"></div></section><section id="studio" class="hidden grid lg:grid-cols-3 gap-5"><form id="awardForm" class="lg:col-span-2 card rounded-xl p-5 space-y-3"><h2 class="text-xl font-bold">Award Youth Points</h2><select id="awardYouth" class="field"></select><select id="awardCategory" class="field"></select><input id="awardPoints" required type="number" min="1" max="100" placeholder="Points" class="field"><textarea id="awardNote" placeholder="Note (optional)" class="field"></textarea><button class="bg-emerald-600 rounded-xl py-3 font-bold">➕ Award points</button></form><div class="card rounded-xl p-5"><h2 class="font-bold">Manage roster</h2><form id="rosterForm" class="space-y-2 mt-4"><input id="newName" required placeholder="Full name" class="field"><div class="flex gap-2"><select id="newGender" class="field w-1/2"><option value="boy">Boy</option><option value="girl">Girl</option></select><select id="newGrade" class="field w-1/2"><option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option></select></div><button class="w-full bg-slate-700 rounded-lg py-2 text-xs font-bold">Add youth</button></form><div id="roster" class="mt-4 space-y-2 text-xs"></div></div></section></main></section>
<script>
document.querySelectorAll('.field').forEach(x=>x.classList.add('w-full','bg-slate-950','border','border-slate-700','rounded-xl','px-3','py-2.5','text-sm'));const C={early:'⏰ Early arrival',bible_read:'📖 Bible reading',verse_recite:'🗣️ Verse recitation',involvement:'💡 Involvement',misc:'🎁 Miscellaneous'},S={mode:'login',role:'youth',token:localStorage.getItem('imago_token'),me:null,youth:[],gender:'all',sort:'total',query:''},$=id=>document.getElementById(id);const api=async(p,o={})=>{const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d};function msg(x){$('message').textContent=x}function notice(x,good=true){$('toast').innerHTML=`<div class="${good?'bg-emerald-600':'bg-rose-600'} p-3 rounded-lg text-sm font-bold">${x}</div>`;setTimeout(()=>$('toast').innerHTML='',3500)}
function authView(){let s=S.mode==='signup';$('signupFields').classList.toggle('hidden',!s);$('grade').classList.toggle('hidden',s&&S.role==='servant');$('authTitle').textContent=s?'Create your account':'Welcome back';$('authHint').textContent=s?'Choose your role and create a username.':'Log in to view your points and notifications.';$('submit').textContent=s?'Create account':'Log in';$('name').required=s&&S.role==='youth'}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{S.mode=b.id==='signupMode'?'signup':'login';document.querySelectorAll('.mode').forEach(x=>x.className='mode w-1/2 rounded-lg py-2 text-slate-300 font-bold');b.className='mode w-1/2 rounded-lg py-2 bg-white text-indigo-950 font-bold';authView()});document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.className='role w-1/2 rounded-xl py-2.5 bg-slate-800 text-slate-300 font-bold');b.className='role w-1/2 rounded-xl py-2.5 bg-fuchsia-600 font-bold';authView()});
async function auth(e){e.preventDefault();let p={username:$('username').value,password:$('password').value,role:S.role};if(S.mode==='signup'){p.name=$('name').value;if(S.role==='youth'){p.gender=$('gender').value;p.grade=$('grade').value}}try{let d=await api(S.mode==='signup'?'/auth/signup':'/auth/login',{method:'POST',body:JSON.stringify(p)});if(!d.access_token){msg(d.message);return}S.token=d.access_token;localStorage.setItem('imago_token',S.token);enter()}catch(e){msg(e.message);notice(e.message,false)}}async function enter(){S.me=await api('/auth/me');$('landing').classList.add('hidden');$('app').classList.remove('hidden');$('account').textContent=`${S.me.role==='servant'?'🛡️':'📱'} ${S.me.username}`;$('servantTab').classList.toggle('hidden',S.me.role!=='servant');load()}async function load(){S.youth=await api('/leaderboard');render();if(S.me.youth_id)notes()}function render(){let a=S.youth.filter(y=>(S.gender==='all'||y.gender===S.gender)&&(!S.query||`${y.name} ${y.grade||''}`.toLowerCase().includes(S.query))).sort((x,y)=>(y.points[S.sort]||0)-(x.points[S.sort]||0)),me=S.youth.find(y=>y.id===S.me.youth_id)||a[0];$('count').textContent=`${a.length} youth`;$('hero').innerHTML=me?`<div class="flex justify-between"><div><div class="text-xs text-fuchsia-300 font-bold uppercase">${S.me.role==='servant'?'Servant account':'Your youth profile'}</div><h2 class="text-2xl font-black mt-1">${me.name}</h2><p class="text-sm text-slate-400">${me.gender==='boy'?'👦':'👧'} Grade ${me.grade||'—'} · Rank #${me.rank}</p></div><div class="text-right text-4xl text-amber-300 font-black">${me.total}<small class="block text-xs text-slate-400">points</small></div></div>`:'<p>No youth profiles yet.</p>';$('leaderboard').innerHTML=a.map((y,i)=>`<div class="px-4 py-3 flex items-center gap-3 hover:bg-indigo-900/20"><b class="w-8 text-amber-300">#${y.rank||i+1}</b><span>${y.gender==='boy'?'👦':'👧'}</span><span class="flex-1"><b>${y.name}</b><small class="block text-xs text-slate-400">Grade ${y.grade||'—'} · ${y.points[S.sort]||0} selected points</small></span><strong>${y.total}</strong></div>`).join('')||'<div class="p-8 text-center text-slate-400">No matching youth.</div>';if(S.me.role==='servant'){ $('awardYouth').innerHTML=S.youth.map(y=>`<option value="${y.id}">${y.name}</option>`).join('');$('awardCategory').innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('roster').innerHTML=S.youth.map(y=>`<div class="flex justify-between bg-slate-900 rounded p-2"><span>${y.name}</span><button data-remove="${y.id}" class="text-rose-300">Remove</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeYouth(b.dataset.remove))}}
async function notes(){try{let n=await api('/notifications/'+S.me.youth_id);$('unread').textContent=n.filter(x=>!x.read_at).length;$('notifications').innerHTML=n.length?n.map(x=>`<div class="card rounded-xl p-4"><b>🎉 +${x.points} points</b><p class="text-sm mt-1">${C[x.category]||x.category}${x.note?' — '+x.note:''}</p><small class="text-slate-400">By ${x.awarded_by} · ${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'<div class="card rounded-xl p-8 text-center text-slate-400">No notifications yet.</div>'}catch(e){notice(e.message,false)}}async function award(e){e.preventDefault();try{await api('/awards',{method:'POST',body:JSON.stringify({youth_id:$('awardYouth').value,category:$('awardCategory').value,points:+$('awardPoints').value,note:$('awardNote').value||null})});e.target.reset();notice('Points awarded');load()}catch(e){notice(e.message,false)}}async function addYouth(e){e.preventDefault();try{await api('/youth',{method:'POST',body:JSON.stringify({name:$('newName').value,gender:$('newGender').value,grade:$('newGrade').value})});e.target.reset();notice('Youth added');load()}catch(e){notice(e.message,false)}}async function removeYouth(id){if(!confirm('Remove this youth?'))return;await api('/youth/'+id,{method:'DELETE'});load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.replace('border-amber-400','border-transparent'));b.classList.replace('border-transparent','border-amber-400');['board','notes','studio'].forEach(x=>$(`${x}`).classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='notes'&&S.me.youth_id)notes()});document.querySelectorAll('.gender').forEach(b=>b.onclick=()=>{S.gender=b.dataset.gender;render()});$('sort').onchange=e=>{S.sort=e.target.value;render()};$('search').oninput=e=>{S.query=e.target.value.toLowerCase();render()};$('authForm').onsubmit=auth;$('awardForm').onsubmit=award;$('rosterForm').onsubmit=addYouth;$('logout').onclick=()=>{localStorage.removeItem('imago_token');location.reload()};if(S.token)enter().catch(()=>{localStorage.removeItem('imago_token');S.token=null});authView();
</script></body></html>
